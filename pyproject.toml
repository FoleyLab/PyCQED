[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pycqed"
version = "0.2.0.dev0"
description = "Fewest-switches surface hopping on (non-Hermitian) cavity-QED polaritonic surfaces"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pycqed-fssh = "pycqed.cli:main"

[tool.setuptools]
packages = ["pycqed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
